<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Request a secure HOPE System password reset link.">
  <meta name="referrer" content="no-referrer">
  <title>Forgot password | HOPE System</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/forgot-password.js" defer></script>
</head>
<body>
  <main class="page-shell">
    <section class="registration-card" aria-labelledby="page-title">
      <div class="brand-mark" aria-hidden="true">H</div>
      <p class="eyebrow">HOPE SYSTEM</p>
      <h1 id="page-title">Forgot your password?</h1>
      <p class="intro">Enter the email associated with your account. If it is eligible, we will send a secure reset link.</p>

      <form id="forgot-password-form" action="/api/auth/forgot-password" method="post">
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" maxlength="254" required>
        </div>
        <p id="form-message" class="form-message" role="status" aria-live="polite"></p>
        <button id="submit-button" type="submit">Send reset link</button>
      </form>

      <p class="fine-print"><a href="/register">Return to registration</a></p>
    </section>
  </main>
</body>
</html>
