<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Sign in to the HOPE System.">
  <title>Sign in | HOPE System</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/login.js" defer></script>
</head>
<body>
  <main class="page-shell">
    <section class="registration-card" aria-labelledby="page-title">
      <div class="brand-mark" aria-hidden="true">H</div>
      <p class="eyebrow">HOPE SYSTEM</p>
      <h1 id="page-title">Welcome back</h1>
      <p class="intro" id="page-intro">Sign in with your account to continue to your workspace.</p>

      <form id="login-form">
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="username" maxlength="254" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <p id="login-message" class="form-message" role="status" aria-live="polite"></p>
        <button id="login-button" type="submit">Sign in</button>
      </form>

      <form id="change-password-form" hidden>
        <div class="field">
          <label for="current-password">Current password</label>
          <input id="current-password" name="currentPassword" type="password" autocomplete="current-password" required>
        </div>
        <div class="field">
          <label for="new-password">New password</label>
          <input id="new-password" name="newPassword" type="password" autocomplete="new-password" minlength="12" maxlength="72" required>
          <small>Use at least 12 characters. Passwords over 72 UTF-8 bytes are not accepted.</small>
        </div>
        <div class="field">
          <label for="confirm-password">Confirm new password</label>
          <input id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password" minlength="12" maxlength="72" required>
        </div>
        <p id="change-message" class="form-message" role="status" aria-live="polite"></p>
        <button id="change-button" type="submit">Change password</button>
      </form>
      <p class="fine-print"><a href="/forgot-password">Forgot your password?</a> <span aria-hidden="true">·</span> <a href="/register">Request an account</a></p>
    </section>
  </main>
</body>
</html>
