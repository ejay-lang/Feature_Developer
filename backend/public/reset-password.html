<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Set a new HOPE System password.">
  <meta name="referrer" content="no-referrer">
  <title>Reset password | HOPE System</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/reset-password.js" defer></script>
</head>
<body>
  <main class="page-shell">
    <section class="registration-card" aria-labelledby="page-title">
      <div class="brand-mark" aria-hidden="true">H</div>
      <p class="eyebrow">HOPE SYSTEM</p>
      <h1 id="page-title">Set a new password</h1>
      <p class="intro">Choose a new password for your account. The reset link is valid for one hour and can only be used once.</p>

      <form id="reset-password-form" action="/api/auth/reset-password" method="post">
        <input id="token" name="token" type="hidden">
        <div class="field">
          <label for="newPassword">New password</label>
          <input id="newPassword" name="newPassword" type="password" autocomplete="new-password" minlength="12" maxlength="72" aria-describedby="password-help" required>
          <small id="password-help">Use at least 12 characters. Passwords over 72 UTF-8 bytes are not accepted.</small>
        </div>
        <div class="field">
          <label for="confirmPassword">Confirm new password</label>
          <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="12" maxlength="72" required>
        </div>
        <p id="form-message" class="form-message" role="status" aria-live="polite"></p>
        <button id="submit-button" type="submit">Reset password</button>
      </form>

      <p class="fine-print"><a href="/forgot-password">Request another reset link</a></p>
    </section>
  </main>
</body>
</html>
